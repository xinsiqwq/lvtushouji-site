<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none';">
  <title>旅行星图</title>
  <style>
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#0B0C0E;color:#e3e3e3;color-scheme:only dark}
    canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
    canvas:focus-visible{outline:1px solid #c5a56b;outline-offset:-3px}
    #status{position:absolute;inset:0;display:grid;place-content:center;font:14px/1.6 system-ui,sans-serif;text-align:center;color:#bccad8;pointer-events:none}
    #status[hidden]{display:none}
  </style>
</head>
<body>
  <canvas id="sky" role="img" aria-label="可拖动的实景星图" tabindex="0"></canvas>
  <div id="status" role="status" aria-live="polite">正在加载本地星图…</div>
  <script type="module" src="./runtime.js"></script>
</body>
</html>
